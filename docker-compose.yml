# Backend PDA in Docker. Pensato per un server Plesk con MySQL locale: vedi GUIDA-DEPLOY.md.
#
#   cp env.production.example .env      # poi compila i valori
#   docker compose up -d --build
#
# network_mode: host = il container usa la rete del server: raggiunge il MySQL locale (127.0.0.1) e le macchine
# della rete del negozio (Passepartout, stampante etichette, DB frigoriferi) esattamente come un processo normale,
# senza toccare bind-address o permessi utente su MySQL. Con questa modalità "ports" non serve.
services:
  backend:
    container_name: cdf_warehouse_pda
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      # L'API non ha autenticazione: ascolta solo su localhost, ci arriva nginx (vedi nginx-plesk.conf)
      LISTEN_HOST: 127.0.0.1
      CREATED_PRODUCTS_LOG_PATH: /app/logs/created-products.log
    volumes:
      # Registro dei prodotti creati da palmare: sta fuori dal container per non perderlo a ogni ricostruzione
      - ./logs:/app/logs
