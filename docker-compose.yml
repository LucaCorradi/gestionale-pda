# Backend PDA in Docker (server Plesk con MySQL già presente): vedi GUIDA-DEPLOY.md.
#
#   cp env.production.example .env      # poi compila i valori
#   docker compose up -d --build
#
# RETE. Il container entra nella rete Docker "cdfnet", quella già esistente sul server e usata dall'altro gestionale:
#  - MySQL accetta l'utente dell'app dagli indirizzi 172.18.20.% (la rete cdfnet) e si raggiunge su 172.18.20.1
#    (il gateway della rete): nel .env DB_HOST=172.18.20.1. Non serve toccare permessi o bind-address di MySQL.
#  - Passepartout, stampante etichette e DB frigoriferi (rete del negozio) si raggiungono come dall'altro container.
#  - La porta dell'app è pubblicata SOLO su localhost del server: ci arriva nginx (vedi nginx-plesk.conf).
#    L'API non ha autenticazione e non deve essere raggiungibile dalla rete.
# La rete cdfnet deve esistere (docker network ls). Se non la usi: togli "networks" e "ports", metti "network_mode: host",
# imposta LISTEN_HOST=127.0.0.1 e DB_HOST=127.0.0.1, e serve un utente MySQL ammesso da localhost.
services:
  backend:
    container_name: pda_backend
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      CREATED_PRODUCTS_LOG_PATH: /app/logs/created-products.log
      # Vuoto di proposito: dentro il container l'app deve ascoltare su tutte le interfacce, altrimenti la porta pubblicata non
      # la raggiunge nessuno (502 in nginx). A limitare l'accesso a localhost del server ci pensa "ports" qui sotto.
      LISTEN_HOST: ""
    ports:
      # solo localhost del server; la porta è quella di PORT nel .env (8789)
      - "127.0.0.1:${PORT:-8789}:${PORT:-8789}"
    networks:
      - cdfnet
    volumes:
      # Registro dei prodotti creati da palmare: sta fuori dal container per non perderlo a ogni ricostruzione
      - ./logs:/app/logs
      # Formati dei barcode a quantità variabile: si modifica il JSON sul server e si vede alla scansione successiva, senza ricostruire
      - ./config:/app/config

networks:
  cdfnet:
    external: true
