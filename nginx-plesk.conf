# Da incollare in: Plesk -> Siti web e domini -> pda.cdf -> Impostazioni Apache e Nginx
# -> "Direttive aggiuntive per nginx" (se ci sono due campi, HTTP e HTTPS, incollale in quello che usi: di norma in entrambi).
#
# Presuppone che il frontend compilato (la cartella "frontend" del pacchetto) sia nella document root del dominio
# (di solito /var/www/vhosts/pda.cdf/httpdocs) e che il backend giri in Docker su 127.0.0.1:8787.
#
# NB: non definiamo qui un blocco "location /" - Plesk ne genera già uno per servire i file statici del dominio,
# e due "location /" identici mandano in errore nginx ("duplicate location"). Il fallback su index.html per le
# rotte di React (es. /wizard/step2, /products) lo otteniamo con error_page 404, che intercetta i "file non trovato"
# del blocco già esistente di Plesk. proxy_intercept_errors serve perché su molte configurazioni Plesk le richieste
# senza estensione statica vengono inoltrate ad Apache, e un 404 di Apache non verrebbe intercettato.
proxy_intercept_errors on;
error_page 404 /index.html;

# API: passate al backend Node in Docker, raggiungibile solo su localhost:8787
location /api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dopo un riavvio del backend la prima richiesta sui prodotti aspetta il caricamento dell'elenco articoli
    # da Passepartout (circa 30 secondi): timeout più larghi di quelli standard (60 s)
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
