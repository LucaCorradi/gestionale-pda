version: 2.1

executors:
  office-machine:
    machine: true
    resource_class: the-bb-s-way/office

jobs:
  dev_devops:
    executor: office-machine
    steps:
      - checkout
      - run:
          name: Build/Update stack (docker-compose)
          command: |
            export DOCKER_TAG="develop-$(date +%Y%m%d)"
            docker rm -f cdf_warehouse_pda || true

            docker builder prune -af & wait

            docker compose --env-file /opt/envs/cdf_warehouse_pda/.env.develop --project-name "cdf_warehouse_pda" up -d --build
  
  prod_deploy:
    executor: office-machine
    steps:
      - checkout
      - run:
          name: Build Docker image
          command: |
            docker system prune --all --force --volumes & wait
            export DOCKER_TAG=prod-$(date +%Y%m%d)
            docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASS
            docker compose --env-file /opt/envs/cdf_warehouse_pda/.env.production --project-name "cdf_warehouse_pda" build --push
  
  prod_pull:
    executor: office-machine
    steps:
      - run:
          name: "Install deps"
          command: |
            sudo apt update -qq
            sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - run: 
          name: "Pull Docker image"
          command: |
            DOCKER_TAG=prod-$(date +%Y%m%d)
            
            # Copia il file .env sul server remoto
            sshpass -p $CDF_SSH_USER_PASS scp -o stricthostkeychecking=no /opt/envs/cdf_warehouse_pda/.env.production $CDF_SSH_USER@$CDF_SSH_ADDRESS:/tmp/.env.production
            
            sshpass -p $CDF_SSH_USER_PASS ssh $CDF_SSH_USER@$CDF_SSH_ADDRESS -o stricthostkeychecking=no "
              echo 'Inizio dello script: ' \$(date);
              echo 'Clearing Docker Cache';
              docker system prune --all --force --volumes & wait;
              echo 'Cache cleared: ' \$(date);

              echo 'Pulling Docker image';
              docker pull sviluppobbsway/cdf_warehouse_pda:${DOCKER_TAG} & wait;
              echo 'Image pulled: ' \$(date);

              echo 'Getting image id';
              IMAGE_ID=\$(docker images -q sviluppobbsway/cdf_warehouse_pda:${DOCKER_TAG});
              echo 'Image id: ' \$IMAGE_ID;

              echo 'Getting old container id';
              OLD_CONTAINER_ID=\$(docker ps -aqf 'name=cdf_warehouse_pda');
              echo 'Old container id: ' \$OLD_CONTAINER_ID;

              if [ -n \"\$OLD_CONTAINER_ID\" ]; then
                  echo 'Stopping old container';
                  docker stop \$OLD_CONTAINER_ID & wait;

                  echo 'Removing old container';
                  docker rm \$OLD_CONTAINER_ID & wait;
              fi;

              echo 'Starting New Container...';
              docker run -p 8787:8787 -d --restart unless-stopped --env-file /tmp/.env.production --name cdf_warehouse_pda \$IMAGE_ID;

              # Network
              docker network connect cdfnet cdf_warehouse_pda --ip 172.18.20.103 & wait;
              docker network disconnect bridge cdf_warehouse_pda & wait;

              echo 'Restarting container with new networks';
              docker restart cdf_warehouse_pda & wait; 

              # Rimozione file env
              rm /tmp/.env.production;

              echo 'Deployment Complete'
            "         

workflows:
  version: 2
  deploy_dev:
    jobs:
      - dev_devops:
          filters:
            branches:
              only: develop
          context: TheBBsWay
  deploy_prod:
    jobs:
      - prod_deploy:
          filters:
            branches:
              only: master
          context: TheBBsWay
      - prod_pull:
          requires:
            - prod_deploy
          filters:
            branches:
              only: master
          context: TheBBsWay