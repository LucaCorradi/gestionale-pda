# PDA (pda.lacdf.it) — da incollare in: Plesk → Siti web e domini → pda.lacdf.it → Impostazioni Apache e Nginx
# → "Direttive aggiuntive per nginx", sezione HTTPS. Il dominio punta all'IP interno del server: si raggiunge solo dalla VPN.
#
# La document root la riempie deploy/aggiorna-server.sh.
# Mai un "location /": Plesk ne genera già uno e due uguali mandano in errore nginx ("duplicate location").
# Il ritorno su index.html per le rotte di React Router (/products, /charts...) si ottiene con error_page; proxy_intercept_errors
# serve perché Plesk può passare i file statici ad Apache, ma va spento sull'API, altrimenti i 404 del backend
# (es. "prodotto non trovato" alla scansione) diventano index.html.

proxy_intercept_errors on;
error_page 404 =200 /index.html;

location /api/ {
    proxy_pass http://127.0.0.1:8789/api/;
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dopo un riavvio del backend la prima richiesta sui prodotti aspetta il caricamento dell'elenco articoli
    # da Passepartout (circa 30 secondi): timeout più larghi di quelli standard (60 s)
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
